# ==============================================================================
# Telegram Local LLM Bot — Docker Compose
# ==============================================================================
services:
  ollama:
    image: ollama/ollama:latest
    container_name: local-llm-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/api/tags"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    # در صورت داشتن کارت گرافیک NVIDIA، بخش زیر را از کامنت خارج کنید:
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

  bot:
    build: .
    container_name: telegram-llm-bot
    depends_on:
      ollama:
        condition: service_healthy
    env_file:
      - .env
    environment:
      - OLLAMA_HOST=http://ollama:11434
    volumes:
      - ./.state:/app/.state
    restart: unless-stopped
    command: python bot.py

volumes:
  ollama_data:
